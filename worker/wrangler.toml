# Cloudflare Worker for the Discord slash commands. GitHub Actions deploys it
# (workflow: Deploy Worker) whenever anything in worker/ changes.
name = "rams-bot"
main = "worker.js"
compatibility_date = "2025-09-01"
account_id = "e103cefd2088c2bdf08cc19187b9f225"
workers_dev = true

# Every minute: start GitHub jobs at the exact time (see timer.js).
[triggers]
crons = ["* * * * *"]

# Ram game state (points, crates, items, bets): one SQLite Durable Object.
[[durable_objects.bindings]]
name = "GAME"
class_name = "Game"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Game"]
