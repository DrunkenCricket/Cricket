name: Rams Game Day Lineup

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # checks every 15 min; posts once, 15-90 min before Rams kickoff
  workflow_dispatch:
    inputs:
      preview:
        description: "Preview only (print in the log, don't post)"
        type: boolean
        default: true

permissions:
  contents: write           # to save state/gameday.json

concurrency:
  group: gameday
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python gameday.py
        env:
          DISCORD_INJURY_WEBHOOK: ${{ secrets.INJURY_REPORT }}
          PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.preview }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && !inputs.preview }}
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/gameday.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update game day state"
          git pull --rebase -q && git push
