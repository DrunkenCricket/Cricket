name: NFL Week Schedule

on:
  schedule:
    - cron: "0 17 * * 2"   # Tuesday 9:00 AM PST (10:00 AM during PDT)
  workflow_dispatch:        # "Run workflow" button for manual posts

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nfl_week.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
