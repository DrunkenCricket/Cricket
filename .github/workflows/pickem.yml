name: Rams Pick'em

on:
  schedule:
    # Tuesdays, hourly 13:00-18:00 UTC (5-10 AM PST / 6-11 AM PDT).
    # The script posts on the first run at or after 6 AM PT; later runs retry if that failed.
    - cron: "0 13-18 * * 2"
    # Monday 11 PM PT (06:00 UTC Tue in PDT, 07:00 UTC Tue in PST): log last week's picks.
    - cron: "0 6,7 * * 2"
  workflow_dispatch:        # manual runs always delete the old polls and post now
    inputs:
      scheduled:
        description: "Act like a scheduled run (used by the Cloudflare timer)"
        type: boolean
        default: false

permissions:
  contents: write           # to save state/pickem.json

concurrency:
  group: pickem
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python pickem.py
        env:
          DISCORD_PICKEM_WEBHOOK: ${{ secrets.DISCORD_PICKEM }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled == true || inputs.scheduled == 'true' }}
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state $([ -d data ] && echo data)
          git diff --cached --quiet && exit 0
          git commit -m "Update pick'em state and picks log"
          git pull --rebase -q && git push
