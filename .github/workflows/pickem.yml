name: Rams Pick'em

on:
  schedule:
    # Tuesday noon PT: 20:00 UTC in PST, 19:00 UTC in PDT. The script only acts on the noon run.
    - cron: "0 19 * * 2"
    - cron: "0 20 * * 2"
  workflow_dispatch:        # manual runs always delete the old polls and post now

permissions:
  contents: write           # to save state/pickem.json

concurrency:
  group: pickem
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python pickem.py
        env:
          DISCORD_PICKEM_WEBHOOK: ${{ secrets.DISCORD_PICKEM }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/pickem.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update pick'em state"
          git pull --rebase -q && git push
