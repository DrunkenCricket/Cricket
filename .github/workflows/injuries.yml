name: Rams Injury Report

on:
  schedule:
    - cron: "17 * * * *"   # every hour; only posts when the report changes
  workflow_dispatch:        # manual runs always post

permissions:
  contents: write           # to save state/injury.json

concurrency:
  group: injury-report
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python injuries.py
        env:
          DISCORD_INJURY_WEBHOOK: ${{ secrets.INJURY_REPORT }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/injury.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update injury report state"
          git pull --rebase -q && git push
